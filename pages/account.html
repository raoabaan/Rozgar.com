<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="../assets/account.css">
</head>

<body>

    <!-- Background Slideshow -->
    <div class="bg-slideshow">
        <img src="../rozgar/ehmitrich-ZGY5Pp8Xxaw-unsplash.jpg" alt="Painter">
        <img src="../rozgar/johnathan-macedo-4NQEvxW2_4w-unsplash.jpg" alt="Carpenter">
        <img src="../rozgar/samuel-cruz-t1pwbnk2lm0-unsplash.jpg" alt="Electrician">
        <img src="../rozgar/pylyp-sukhenko-y-XZf_TNRms-unsplash.jpg" alt="Engineer">
    </div>
    <div class="overlay"></div>

    <!-- navbar -->
    <nav class="navbar naav navbar-expand-lg shadow-lg">
        <div class="container mt-2">
            <a class="navbar-brand fw-bold" href="../index.html"><img
                    src="../rozgar/rozgar urdu white bg romove.png" width="150" height="auto" alt=""></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto nav-button">
                    <!-- From Uiverse.io by alexmaracinaru -->
                    <button class="cta">
                        <a href="../index.html"><span class="hover-underline-animation">Back to Home</span>
                        </a> </button>
                    <!-- <li class="nav-item fs-5"><a class="nav-link hom hover-underline-animation text-white" href="../index.html">Back to Home</a></li> -->
                    <!-- <li class="nav-item fs-5"><a class="nav-link text-white" href="About.html">About</a></li> -->
                    <!-- <li class="nav-item fs-5"><a class="nav-link text-white" href="employee.html">Employees</a></li> -->
                    <!-- <li class="nav-item fs-5"><a class="nav-link text-white" href="account.html">Account</a></li> -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Account Section -->
    <div class="account-container">
        <ul class="nav nav-tabs mb-4" id="accountTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login"
                    type="button" role="tab">Login</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="signup-tab" data-bs-toggle="tab" data-bs-target="#signup" type="button"
                    role="tab">Create Account</button>
            </li>
        </ul>

        <div class="tab-content" id="accountTabsContent">
            <!-- Login Form -->
            <div class="tab-pane fade show active" id="login" role="tabpanel">
                <h3 class="mb-3">Login</h3>
                <form>
                    <div class="mb-3">
                        <label>Email or Phone</label>
                        <input type="text" class="form-control" placeholder="Enter your email or phone">
                    </div>
                    <div class="mb-3">
                        <label>Password</label>
                        <input type="password" class="form-control" placeholder="Enter password">
                    </div>
                    <div class="mb-3 text-end">
                        <a href="#" class="text-muted">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <div class="divider">
                    <span>or</span>
                </div>
                <div class="goog d-grid gap-3">
                    <div class="rounded-2 btn border border-1 border-black p-2" style="--bs-border-opacity: .5;"><a
                            class="text-decoration-none text-dark fw-bold" href=""><img
                                src="../rozgar/google-icon-logo-svgrepo-com.svg" height="20px"> &nbsp;Continue with
                            Google</a></div>
                    <div class="rounded-2 btn border border-1 border-black p-2" style="--bs-border-opacity: .5;"><a
                            class="text-decoration-none text-dark fw-bold" href=""><img
                                src="../rozgar/facebook-2-logo-svgrepo-com.svg" height="20px"> &nbsp;Continue with
                            Facebook</a></div>
                    <!-- <div class="rounded-2 btn border border-1 border-black p-2" style="--bs-border-opacity: .5;"><a
                            class="text-decoration-none text-dark fw-bold" href=""><img
                                src="../rozgar/apple-black-logo-svgrepo-com.svg" height="20px"> &nbsp;Continue with
                            Apple</a></div> -->
                </div>
            </div>

            <!-- Signup Form -->
            <div class="tab-pane fade" id="signup" role="tabpanel">
                <h3 class="mb-3">Create Account</h3>
                <form>
                    <div class="mb-3">
                        <label>Full Name</label>
                        <input type="text" class="form-control" placeholder="Enter your name">
                    </div>
                    <div class="mb-3">
                        <label>Email or Phone</label>
                        <input type="text" class="form-control" placeholder="Enter your email or phone">
                    </div>
                    <div class="mb-3">
                        <label>Password</label>
                        <input type="password" class="form-control" placeholder="Enter password">
                    </div>
                    <div class="mb-3">
                        <label>Confirm Password</label>
                        <input type="password" class="form-control" placeholder="Confirm password">
                    </div>
                    <div class="mb-3">
                        <label>City / Location</label>
                        <input type="text" class="form-control" placeholder="Enter your city">
                    </div>
                    <div class="mb-3">
                        <label>Account Type</label>
                        <select class="form-select">
                            <option>I want to hire</option>
                            <option>I want to work</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Profession (if Worker)</label>
                        <input type="text" class="form-control" placeholder="e.g. Carpenter, Painter, Electrician">
                    </div>
                    <div class="mb-3">
                        <label>Profile</label>
                        <input type="file" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Create Account</button>
                </form>
            </div>
        </div>
    </div>


    <!-- Footer -->
    <footer class="naav fw-bold text-white text-center py-2 mt-5" style="position: relative; z-index: 2;">
        <div class="container">
            <p>&copy; 2025 Rozgar.com - All rights reserved.</p>
            <p><a href="#" class="text-white">Privacy Policy</a> | <a href="#" class="text-white">Terms of Service</a>
            </p>
        </div>
    </footer>

</body>

</html>
